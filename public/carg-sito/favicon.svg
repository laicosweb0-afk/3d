<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A 16px il tondo del marchio diventa una macchia: resta la ghiera nera,
       l'anello blu e la G, che è l'unica forma che si riconosce a quella
       dimensione. -->
  <circle cx="32" cy="32" r="31" fill="#06080c"/>
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="#2b5cf0" stroke-width="2.5"/>
  <text x="32" y="45" text-anchor="middle"
        font-family="Inter, Helvetica, Arial, sans-serif" font-weight="700"
        font-size="38" fill="#eef2f7">G</text>
</svg>
