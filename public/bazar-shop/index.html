<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bazar Marrakech — Divani e salotti in velluto e oro</title>
<meta name="description" content="Divani, poltrone e salotti completi in velluto e oro. Showroom a Lugo (RA), consegne in tutta Italia.">
<meta name="theme-color" content="#0b0a09">
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<meta property="og:title" content="Bazar Marrakech">
<meta property="og:description" content="Il tuo salotto ti aspetta. Velluto, capitonné e dettagli in oro.">
<meta property="og:image" content="img/salotto-completo.webp">
<style>
@font-face{font-family:Poppins;font-weight:300;font-display:swap;src:url(fonts/poppins-300.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:400;font-display:swap;src:url(fonts/poppins-400.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:500;font-display:swap;src:url(fonts/poppins-500.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:600;font-display:swap;src:url(fonts/poppins-600.woff2) format('woff2')}

:root{
  --ink:#0b0a09; --ink-2:#151210; --ink-3:#1f1a17;
  --paper:#fbf8f3; --cream:#f3ece2; --sand:#ebe1d2;
  --gold:#d6b67c; --gold-deep:#a8844c;
  --on-dark:#f3ede3; --on-dark-2:#a69d91;
  --on-light:#1c1916; --on-light-2:#6f675d;
  --line-dark:rgba(243,237,227,.12); --line-light:rgba(28,25,22,.1);
  --r-s:14px; --r:22px; --r-l:30px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --nav-h:52px;
  --pad:max(20px, env(safe-area-inset-left));
  --w:1080px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:var(--on-light);
  -webkit-font-smoothing:antialiased;line-height:1.47;font-size:17px;overflow-x:hidden}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--gold);color:var(--ink)}
.wrap{max-width:var(--w);margin:0 auto;padding:0 var(--pad)}
.dark{background:var(--ink);color:var(--on-dark)}
.cream{background:var(--cream)}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-deep)}
.dark .eyebrow{color:var(--gold)}
.h-hero{font-size:clamp(40px,6.6vw,76px);font-weight:600;letter-spacing:-.035em;line-height:1.02}
.h1{font-size:clamp(36px,5.6vw,64px);font-weight:600;letter-spacing:-.03em;line-height:1.05}
.h2{font-size:clamp(28px,4vw,48px);font-weight:600;letter-spacing:-.025em;line-height:1.08}
.h3{font-size:clamp(22px,2.4vw,28px);font-weight:600;letter-spacing:-.015em;line-height:1.15}
.lead{font-size:clamp(19px,2.2vw,24px);font-weight:400;letter-spacing:-.01em;line-height:1.35;color:var(--on-light-2)}
.dark .lead{color:var(--on-dark-2)}
.muted{color:var(--on-light-2)} .dark .muted{color:var(--on-dark-2)}
.gold{color:var(--gold)}
.center{text-align:center}

/* Buttons — Apple pill + text link */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:980px;
  font-size:16px;font-weight:500;letter-spacing:-.01em;transition:transform .2s var(--ease),background .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-gold{background:var(--gold);color:var(--ink)} .btn-gold:hover{background:#e2c48e}
.btn-dark{background:var(--on-light);color:var(--paper)} .btn-dark:hover{background:#000}
.btn-ghost{border:1px solid currentColor;opacity:.9} .btn-ghost:hover{opacity:1}
.btn-block{width:100%;min-height:52px;font-size:17px}
.link{color:var(--gold-deep);font-weight:500;display:inline-flex;align-items:center;gap:4px}
.dark .link{color:var(--gold)}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.link::after{content:"›";font-size:1.25em;line-height:1;transform:translateY(-1px)}
.ctas{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}

/* Nav */
.nav{position:fixed;inset:0 0 auto;z-index:50;height:var(--nav-h);background:rgba(11,10,9,.86);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--on-dark);
  border-bottom:1px solid var(--line-dark)}
.nav .wrap{height:100%;display:flex;align-items:center;gap:8px}
.nav-logo{display:flex;align-items:center;height:100%;margin-right:auto}
.nav-logo img{height:24px;width:auto}
.nav-links{display:flex;gap:30px;margin-right:30px}
.nav-links a{font-size:13px;letter-spacing:.01em;color:rgba(243,237,227,.82);transition:color .2s}
.nav-links a:hover,.nav-links a[aria-current]{color:#fff}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;position:relative;color:rgba(243,237,227,.88)}
.icon-btn:hover{color:#fff}
.icon-btn svg{width:18px;height:18px}
.badge{position:absolute;top:5px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--gold);color:var(--ink);
  font-size:10px;font-weight:600;display:grid;place-items:center;transform:scale(0);transition:transform .3s var(--ease)}
.badge.on{transform:scale(1)}
.menu-btn{display:none}
.subnav{position:sticky;top:var(--nav-h);z-index:40;background:rgba(251,248,243,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line-light)}
.subnav .wrap{display:flex;align-items:center;height:52px;gap:20px}
.subnav-title{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subnav .btn{min-height:30px;padding:0 14px;font-size:13px}
.subnav .price{font-size:13px;color:var(--on-light-2);white-space:nowrap}

/* Mobile menu */
.sheet-menu{position:fixed;inset:0;z-index:60;background:var(--ink);color:var(--on-dark);padding:calc(var(--nav-h) + 24px) 32px 40px;
  opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility .35s}
.sheet-menu.open{opacity:1;visibility:visible}
.sheet-menu a{display:block;font-size:30px;font-weight:600;letter-spacing:-.02em;padding:8px 0;opacity:0;transform:translateY(-8px);
  transition:opacity .4s var(--ease),transform .4s var(--ease)}
.sheet-menu.open a{opacity:1;transform:none}
.sheet-menu.open a:nth-child(2){transition-delay:.04s}.sheet-menu.open a:nth-child(3){transition-delay:.08s}
.sheet-menu.open a:nth-child(4){transition-delay:.12s}.sheet-menu.open a:nth-child(5){transition-delay:.16s}
.sheet-menu .close{position:absolute;top:6px;right:12px}

main{padding-top:var(--nav-h);min-height:100vh}

/* Reveal */
.rv{opacity:0;transform:translateY(28px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.1s}.rv.d2{transition-delay:.2s}.rv.d3{transition-delay:.3s}

/* HERO */
.hero{position:relative;min-height:calc(100svh - var(--nav-h));overflow:hidden;display:flex;flex-direction:column;align-items:center;
  text-align:center;padding:clamp(48px,9vh,96px) var(--pad) 0}
.hero-logo{width:min(300px,62vw);opacity:0;filter:blur(8px);transform:scale(.96);animation:logoIn 1.8s var(--ease) .2s forwards}
@keyframes logoIn{to{opacity:1;filter:none;transform:none}}
.hero-copy{position:relative;z-index:2;margin-top:clamp(28px,5vh,48px);opacity:0;transform:translateY(16px);animation:up 1.2s var(--ease) 1.1s forwards}
@keyframes up{to{opacity:1;transform:none}}
.hero-copy .h-hero{max-width:12ch;margin:0 auto}
.hero-copy .lead{margin:18px auto 30px;max-width:34ch}
.hero-media{position:relative;width:min(1200px,100%);margin-top:clamp(28px,5vh,56px);flex:1;min-height:42vh;
  opacity:0;animation:fadeIn 1.6s var(--ease) 1.4s forwards;overflow:hidden;border-radius:var(--r-l) var(--r-l) 0 0}
@keyframes fadeIn{to{opacity:1}}
.hero-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 62%;
  border-radius:var(--r-l) var(--r-l) 0 0;transform:scale(var(--s,1.06));transform-origin:center bottom;will-change:transform}
.hero-media::after{content:"";position:absolute;inset:0;border-radius:var(--r-l) var(--r-l) 0 0;
  background:linear-gradient(180deg,rgba(11,10,9,.55) 0%,rgba(11,10,9,0) 30%,rgba(11,10,9,0) 70%,rgba(11,10,9,.5) 100%)}

/* Showcase tiles (Apple homepage stack) */
.tiles{display:grid;gap:12px;padding:12px;background:var(--paper)}
.tile{position:relative;overflow:hidden;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:clamp(44px,6vw,64px) 24px 0;min-height:clamp(560px,72vh,720px);isolation:isolate}
.tile .h1,.tile .h2{max-width:16ch}
.tile .lead{margin:10px auto 22px;max-width:34ch}
.tile-media{margin-top:auto;width:100%;display:flex;justify-content:center;align-items:flex-end;flex:1;padding-top:24px}
.tile-media img{width:min(920px,100%);max-height:520px;object-fit:contain;transition:transform 1.4s var(--ease)}
.tile:hover .tile-media img{transform:scale(1.025)}
.tile.full-bleed .tile-media{position:absolute;inset:0;z-index:-1;padding:0}
.tile.full-bleed .tile-media img{width:100%;height:100%;max-height:none;object-fit:cover}
.tile.full-bleed::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none}
.tile.t-cream{background:#efe5d6}
.tile.t-sand{background:#e9dfd0}
.tile.t-dark{background:var(--ink-2);color:var(--on-dark)}
.tile.t-dark .lead{color:var(--on-dark-2)} .tile.t-dark .link{color:var(--gold)}
.tile.t-night{background:radial-gradient(120% 90% at 50% 100%,#1b2442 0%,#0d1020 55%,#07080f 100%);color:var(--on-dark)}
.tile.t-night .lead{color:#aab0c4}.tile.t-night .eyebrow,.tile.t-night .link{color:var(--gold)}
.tile.t-night .tile-media img{border-radius:var(--r) var(--r) 0 0;max-height:560px;object-fit:cover;width:min(980px,100%);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%);mask-image:linear-gradient(180deg,transparent 0,#000 18%)}
.tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile-grid .tile{min-height:clamp(520px,64vh,640px)}
.tile-grid .tile-media img{max-height:400px}
.tile-grid .h2{font-size:clamp(28px,3.2vw,40px)}

/* Detail scrolly */
.scrolly{height:300vh;position:relative;background:var(--ink)}
.scrolly-stick{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;place-items:center}
.scrolly-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(var(--z,1.5));will-change:transform;
  filter:brightness(var(--b,.55))}
.scrolly-copy{position:relative;z-index:2;text-align:center;color:var(--on-dark);padding:0 var(--pad)}
.scrolly-copy .cap{position:absolute;left:50%;top:50%;width:min(90vw,760px);transform:translate(-50%,-40%);opacity:0;
  transition:opacity .7s var(--ease),transform .7s var(--ease)}
.scrolly-copy .cap.on{opacity:1;transform:translate(-50%,-50%)}
.scrolly-copy .cap p{margin-top:14px;color:rgba(243,237,227,.82);font-size:clamp(17px,2vw,21px)}
.scrolly-bar{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
.scrolly-bar i{width:28px;height:3px;border-radius:2px;background:rgba(243,237,227,.25);overflow:hidden;position:relative}
.scrolly-bar i b{position:absolute;inset:0;background:var(--gold);transform-origin:left;transform:scaleX(var(--p,0))}

/* Shelf (horizontal scroller, Apple Store) */
.section{padding:clamp(72px,11vw,128px) 0}
.shelf-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
.shelf-head .h2 span{color:var(--on-light-2)}
.dark .shelf-head .h2 span{color:var(--on-dark-2)}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:min(400px,82vw);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:8px max(var(--pad),calc((100vw - var(--w))/2 + 20px)) 36px;scroll-padding:0 max(var(--pad),calc((100vw - var(--w))/2 + 20px));
  scrollbar-width:none;overscroll-behavior-x:contain}
.shelf::-webkit-scrollbar{display:none}
.shelf-nav{display:flex;gap:12px}
.round{width:36px;height:36px;border-radius:50%;background:rgba(28,25,22,.08);display:grid;place-items:center;transition:background .2s,opacity .2s}
.round:hover{background:rgba(28,25,22,.14)} .round:disabled{opacity:.35;cursor:default}
.dark .round{background:rgba(243,237,227,.1)}.dark .round:hover{background:rgba(243,237,227,.18)}
.round svg{width:14px;height:14px}

/* Cards */
.card{scroll-snap-align:start;background:#fff;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 4px 24px rgba(28,25,22,.06);transition:transform .45s var(--ease),box-shadow .45s var(--ease);color:var(--on-light)}
.card:hover{transform:scale(1.015);box-shadow:0 18px 50px rgba(28,25,22,.13)}
.card-media{aspect-ratio:4/3.1;background:#efe5d6;overflow:hidden;position:relative}
.card-media img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.card:hover .card-media img{transform:scale(1.04)}
.card-body{padding:22px 24px 26px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-body .eyebrow{font-size:11px;margin-bottom:2px}
.card-name{font-size:21px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.card-riga{font-size:15px;color:var(--on-light-2);line-height:1.4}
.card-foot{margin-top:auto;padding-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.price{font-size:15px;font-weight:500;white-space:nowrap}
.price.req{color:var(--on-light-2);font-weight:400}
.swatch{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatches{display:flex;gap:6px}
.tag-new{position:absolute;top:14px;left:14px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;
  border-radius:20px;background:rgba(11,10,9,.72);color:var(--gold);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* Promises */
.promises{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.promise{background:#fff;border-radius:var(--r);padding:32px 28px}
.dark .promise{background:var(--ink-3)}
.promise svg{width:34px;height:34px;color:var(--gold-deep);margin-bottom:18px}
.dark .promise svg{color:var(--gold)}
.promise h3{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.promise p{font-size:15px;color:var(--on-light-2)} .dark .promise p{color:var(--on-dark-2)}

/* Showroom */
.showroom{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(28px,5vw,64px);align-items:center}
.showroom-img{border-radius:var(--r-l);overflow:hidden;aspect-ratio:2/3;max-height:820px}
.orari{margin-top:28px;display:grid;gap:6px;font-size:15px}
.orari div{display:flex;justify-content:space-between;gap:16px}
.orari div span:first-child{color:var(--on-dark-2)}
.orari .oggi span{color:var(--on-dark)}
.stato{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin-top:22px}
.stato i{width:8px;height:8px;border-radius:50%;background:#6fbf73;box-shadow:0 0 0 4px rgba(111,191,115,.18)}
.stato.chiuso i{background:#c0473a;box-shadow:0 0 0 4px rgba(192,71,58,.18)}
.showroom-img img{width:100%;height:100%;object-fit:cover}
.contact-list{margin-top:28px;border-top:1px solid var(--line-dark)}
.contact-list a,.contact-list div{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line-dark);font-size:16px}
.contact-list span:first-child{color:var(--on-dark-2);font-size:14px}
.contact-list a:hover span:last-child{color:var(--gold)}

/* Footer */
footer{background:var(--ink);color:var(--on-dark-2);font-size:12px;padding:44px 0 calc(32px + env(safe-area-inset-bottom))}
footer .top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line-dark)}
footer img{height:30px;width:auto;opacity:.95}
.foot-cols{display:flex;gap:56px;flex-wrap:wrap}
.foot-cols h4{color:var(--on-dark);font-weight:500;font-size:12px;margin-bottom:10px}
.foot-cols a{display:block;margin:6px 0} .foot-cols a:hover{color:var(--on-dark)}
footer .bottom{padding-top:18px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* STORE */
.store-head{padding:clamp(48px,7vw,88px) 0 24px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.store-head .h1 span{color:var(--on-light-2)}
.chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:6px 0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 18px;border-radius:980px;background:#fff;font-size:14px;font-weight:500;box-shadow:inset 0 0 0 1px var(--line-light);transition:all .25s}
.chip:hover{box-shadow:inset 0 0 0 1px var(--on-light-2)}
.chip[aria-pressed=true]{background:var(--on-light);color:var(--paper);box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-bottom:96px}
.grid .card{scroll-snap-align:none}
.grid .card.feature{grid-column:span 2}
.grid .card.feature .card-media{aspect-ratio:auto;flex:1;min-height:340px}

/* PRODUCT */
.pdp{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(28px,4vw,56px);padding:40px 0 96px;align-items:start}
.pdp-head{padding-top:clamp(36px,5vw,64px)}
.pdp-head .h1{margin-top:6px}
.pdp-head .price-big{margin-top:10px;font-size:17px;color:var(--on-light-2)}
.gallery{position:sticky;top:calc(var(--nav-h) + 72px)}
.g-main{position:relative;border-radius:var(--r-l);overflow:hidden;background:#efe5d6;aspect-ratio:1/1}
.g-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.g-track::-webkit-scrollbar{display:none}
.g-track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.g-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(251,248,243,.8);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:grid;place-items:center;opacity:0;transition:opacity .3s}
.g-main:hover .g-arrow{opacity:1}
.g-arrow.prev{left:14px}.g-arrow.next{right:14px}
.g-arrow svg{width:14px;height:14px}
.g-thumbs{display:flex;gap:10px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.g-thumbs button{width:62px;height:62px;border-radius:12px;overflow:hidden;opacity:.55;transition:opacity .25s,box-shadow .25s;background:#efe5d6}
.g-thumbs button[aria-current=true]{opacity:1;box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--on-light)}
.g-thumbs img{width:100%;height:100%;object-fit:cover}
.buy h2{font-size:24px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.buy h2 span{color:var(--on-light-2)}
.buy-block{padding:28px 0;border-bottom:1px solid var(--line-light)}
.buy-block:first-child{padding-top:0}
.opt-label{font-size:15px;font-weight:600;margin-bottom:12px}
.opt-label span{font-weight:400;color:var(--on-light-2)}
.finish{display:flex;flex-wrap:wrap;gap:8px}
.finish span{padding:9px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line-light);font-size:14px;background:#fff}
.set-list{list-style:none;display:grid;gap:10px}
.set-list li{display:flex;align-items:center;gap:14px;font-size:15px;background:#fff;border-radius:14px;padding:10px 14px 10px 10px;box-shadow:inset 0 0 0 1px var(--line-light)}
.set-list img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#efe5d6}
.set-list .q{margin-left:auto;color:var(--on-light-2);font-size:14px}
.qty{display:inline-flex;align-items:center;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line-light);background:#fff}
.qty button{width:44px;height:44px;font-size:20px;color:var(--on-light-2)}
.qty button:hover{color:var(--on-light)}
.qty output{min-width:28px;text-align:center;font-weight:500}
.buy-row{display:flex;gap:12px;align-items:center;margin-top:16px}
.buy-row .btn{flex:1}
.heart{width:52px;height:52px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line-light);display:grid;place-items:center;background:#fff;flex:none;transition:transform .2s}
.heart:active{transform:scale(.9)}
.heart svg{width:20px;height:20px}
.heart[aria-pressed=true] svg{fill:#b4483a;stroke:#b4483a}
.services{display:grid;gap:18px}
.service{display:flex;gap:14px;align-items:flex-start;font-size:14px}
.service svg{width:22px;height:22px;flex:none;color:var(--on-light-2);margin-top:1px}
.service strong{display:block;font-weight:600;font-size:15px}
.service span{color:var(--on-light-2)}
.service a{color:var(--gold-deep)}
.closeup{display:grid;grid-template-columns:1fr 1fr;min-height:80vh;background:var(--ink);color:var(--on-dark)}
.closeup-img{overflow:hidden}
.closeup-img img{width:100%;height:100%;object-fit:cover;transform:scale(var(--z,1.12));will-change:transform}
.closeup-copy{display:flex;flex-direction:column;justify-content:center;padding:clamp(40px,7vw,96px)}
.closeup-copy .h2{margin:10px 0 16px}
.closeup-copy ul{list-style:none;margin-top:28px;border-top:1px solid var(--line-dark)}
.closeup-copy li{padding:16px 0;border-bottom:1px solid var(--line-dark);display:flex;justify-content:space-between;gap:16px}
.closeup-copy li span:first-child{color:var(--on-dark-2)}

/* BAG */
.bag{max-width:880px;margin:0 auto;padding:clamp(40px,6vw,80px) var(--pad) 96px}
.bag-title{text-align:center;margin-bottom:8px}
.bag-sub{text-align:center;margin-bottom:40px}
.bag-item{display:grid;grid-template-columns:140px 1fr auto;gap:28px;padding:32px 0;border-top:1px solid var(--line-light);align-items:start}
.bag-item img{width:140px;height:140px;object-fit:cover;border-radius:16px;background:#efe5d6}
.bag-item h3{font-size:22px;font-weight:600;letter-spacing:-.015em}
.bag-item .meta{font-size:14px;color:var(--on-light-2);margin-top:4px}
.bag-item .right{text-align:right;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.bag-item .remove{color:var(--gold-deep);font-size:14px}
.bag-item .remove:hover{text-decoration:underline}
.summary{border-top:1px solid var(--line-light);padding-top:24px;display:grid;gap:12px;font-size:15px}
.summary div{display:flex;justify-content:space-between;gap:16px}
.summary .total{font-size:22px;font-weight:600;padding-top:16px;border-top:1px solid var(--line-light);margin-top:8px}
.checkout{margin-top:48px;background:#fff;border-radius:var(--r-l);padding:clamp(24px,4vw,44px);box-shadow:0 4px 30px rgba(28,25,22,.06)}
.checkout h2{font-size:28px;font-weight:600;letter-spacing:-.02em}
.checkout > p{color:var(--on-light-2);margin:6px 0 24px;font-size:15px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{position:relative}
.field.wide{grid-column:1/-1}
.field input,.field textarea{width:100%;border:1px solid #d6cfc5;border-radius:12px;padding:24px 16px 8px;font-size:17px;background:#fff;
  transition:border-color .2s,box-shadow .2s;outline:0}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--gold-deep);box-shadow:0 0 0 4px rgba(214,182,124,.25)}
.field label{position:absolute;left:17px;top:16px;font-size:17px;color:#8d857b;pointer-events:none;transition:all .18s var(--ease)}
.field input:focus+label,.field input:not(:placeholder-shown)+label,
.field textarea:focus+label,.field textarea:not(:placeholder-shown)+label{top:7px;font-size:12px}
.field.err input{border-color:#c0473a}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:13px;color:var(--on-light-2);margin:18px 0 22px}
.consent input{width:20px;height:20px;accent-color:var(--on-light);flex:none;margin-top:1px}
.pay-note{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px;font-size:13px;color:var(--on-light-2);text-align:center}
.alt-actions{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
.alt-actions .btn{flex:1;background:var(--cream);color:var(--on-light)}
.empty{text-align:center;padding:40px 0}
.empty .btn{margin-top:28px}
.done{text-align:center;padding:40px 0}
.done .code{display:inline-block;margin:22px 0;padding:12px 22px;border-radius:14px;background:var(--ink);color:var(--gold);font-weight:600;letter-spacing:.12em}

/* Flyout "aggiunto" */
.flyout{position:fixed;top:calc(var(--nav-h) + 10px);right:max(16px,calc((100vw - var(--w))/2 + 16px));z-index:70;width:min(360px,calc(100vw - 32px));
  background:rgba(251,248,243,.92);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:18px;opacity:0;transform:translateY(-10px) scale(.98);pointer-events:none;
  transition:opacity .35s var(--ease),transform .35s var(--ease)}
.flyout.on{opacity:1;transform:none;pointer-events:auto}
.flyout .row{display:flex;gap:14px;align-items:center}
.flyout img{width:64px;height:64px;border-radius:12px;object-fit:cover}
.flyout p{font-size:13px;color:#3d7a4a;font-weight:500}
.flyout strong{display:block;font-size:16px;letter-spacing:-.01em}
.flyout .btn{margin-top:14px;width:100%}

/* Page transitions */
.page{animation:pageIn .6s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

@media (max-width:900px){
  .nav-links{display:none}
  .menu-btn{display:grid}
  .tile-grid{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr}
  .grid .card.feature{grid-column:1/-1}
  .promises{grid-template-columns:1fr}
  .showroom{grid-template-columns:1fr}
  .pdp{grid-template-columns:1fr}
  .gallery{position:relative;top:0}
  .closeup{grid-template-columns:1fr}
  .closeup-img{height:60vh}
}
@media (max-width:600px){

}
@media (prefers-reduced-motion:reduce){

let preferiti = new Set(store.get('preferiti', []));
const salvaBorsa = () => { store.set('borsa', borsa); aggiornaBadge(); };
const pezzi = () => borsa.reduce((s, r) => s + r.q, 0);
function aggiornaBadge() {
  const b = $('#badge'); const n = pezzi();
  b.textContent = n; b.classList.toggle('on', n > 0);
}
function aggiungi(id, q = 1) {
  const r = borsa.find((x) => x.id === id);
  if (r) r.q = Math.min(9, r.q + q); else borsa.push({ id, q });
  salvaBorsa();
  const p = byId(id);
  const f = $('#flyout');
  f.innerHTML = `<div class="row"><img src="${p.foto[0]}" alt=""><div><p>✓ Aggiunto alla borsa</p><strong>${esc(p.nome)}</strong></div></div>
    <a class="btn btn-dark" href="#/borsa">Vedi la borsa</a>`;
  f.classList.add('on');
  clearTimeout(aggiungi.t); aggiungi.t = setTimeout(() => f.classList.remove('on'), 3800);
}

function statoOrari() {
  const d = new Date(), g = d.getDay(), h = d.getHours() + d.getMinutes() / 60;
  const oggi = ORARI.find((o) => g >= o.dal && g <= o.al);
  const aperto = oggi && oggi.fasce.some(([a, b]) => h >= a && h < b);
  return `<div class="stato rv d2 ${aperto ? '' : 'chiuso'}"><i></i>${aperto ? 'Aperto ora' : 'Chiuso ora'}</div>
    <div class="orari rv d2">${ORARI.map((o) => `<div class="${o === oggi ? 'oggi' : ''}"><span>${o.giorni}</span><span>${o.testo}</span></div>`).join('')}</div>`;
}

function borsaPagina() {

    </div></div>`;

  const righe = borsa.map((r) => ({ ...r, p: byId(r.id) }));

  <div class="bag">
    <h1 class="h1 bag-title">La tua borsa.</h1>
    <p class="lead bag-sub">${daConfermare ? 'Ti confermiamo prezzi, disponibilità e consegna entro un giorno.' : 'Consegna in tutta Italia.'}</p>
    ${righe.map((r) => `
      <div class="bag-item">
        <a href="#/p/${r.p.id}"><img src="${r.p.foto[0]}" alt="${esc(r.p.nome)}"></a>
        <div><h3>${esc(r.p.nome)}</h3><p class="meta">${r.p.dettagli.join(' · ')}</p>

        <div class="right">
          <div class="qty"><button data-bq="${r.id}" data-d="-1" aria-label="Meno">−</button><output>${r.q}</output><button data-bq="${r.id}" data-d="1" aria-label="Più">+</button></div>
          ${prezzoHtml({ prezzo: r.p.prezzo ? r.p.prezzo * r.q : null })}

      </div>`).join('')}

      <div><span>Consegna</span><span>Calcolata con l'ordine</span></div>

    </div>

    <form class="checkout" id="checkout" novalidate>
      <h2>Completa l'ordine.</h2>
      <p>Lasciaci i tuoi dati: ti ricontattiamo per confermare prezzi, consegna e pagamento. Nessun addebito ora.</p>

        <div class="field"><input id="f-cognome" name="cognome" placeholder=" " autocomplete="family-name" required><label for="f-cognome">Cognome</label></div>

        <div class="field wide"><input id="f-citta" name="citta" placeholder=" " autocomplete="address-level2" required><label for="f-citta">Città di consegna</label></div>
        <div class="field wide"><textarea id="f-note" name="note" placeholder=" "></textarea><label for="f-note">Note (misure, colori, piano, orari…)</label></div>
      </div>
      <label class="consent"><input type="checkbox" name="consenso" required> <span>Acconsento al trattamento dei miei dati per essere ricontattato su questa richiesta.</span></label>
      <button class="btn btn-gold btn-block" type="submit">Invia la richiesta d'ordine</button>

function codice() {
  const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = '';
  for (let i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)];
  return 'BM-' + s;
}

function inviaOrdine(dati) {
  const cod = codice();
  const righe = borsa.map((r) => { const p = byId(r.id); return `• ${r.q} × ${p.nome} — ${prezzoTxt(p)}`; }).join('\n');
  const testo = `Richiesta d'ordine ${cod}\n\n${righe}\n\nNome: ${dati.nome} ${dati.cognome}\nTelefono: ${dati.telefono}\nEmail: ${dati.email || '—'}\nCittà di consegna: ${dati.citta}\nNote: ${dati.note || '—'}`;
  const mail = `mailto:${NEGOZIO.email}?subject=${encodeURIComponent('Richiesta d\'ordine ' + cod)}&body=${encodeURIComponent(testo)}`;
  const wa = WHATSAPP ? `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(testo)}` : '';
  borsa = []; salvaBorsa();
  app.innerHTML = `<div class="bag page"><div class="done">
    <span class="eyebrow">Grazie, ${esc(dati.nome)}</span>
    <h1 class="h1" style="margin-top:10px">La tua richiesta è pronta.</h1>
    <div class="code">${cod}</div>
    <p class="lead" style="max-width:36ch;margin:0 auto">Inviala con un tocco: ti richiamiamo per confermare prezzo, consegna e pagamento.</p>
    <div style="display:grid;gap:12px;max-width:380px;margin:32px auto 0">
      <a class="btn btn-gold btn-block" href="${mail}">Invia per email</a>
      ${wa ? `<a class="btn btn-dark btn-block" href="${wa}" target="_blank" rel="noopener">Invia su WhatsApp</a>` : ''}
      ${NEGOZIO.telefoni.map((t) => `<a class="btn btn-block" style="background:var(--cream)" href="${tel(t.n)}">Chiama ${t.nome}</a>`).join('')}
    </div>
    <p style="margin-top:40px"><a class="link" href="#/">Torna alla home</a></p>
  </div></div>`;
  window.scrollTo(0, 0);
  location.href = mail;
}

/* --- router -------------------------------------------------------------- */
let pulizia = [];
function render() {
  pulizia.forEach((f) => f()); pulizia = [];
  $('#flyout').classList.remove('on');
  const h = location.hash.replace(/^#\/?/, '');
  const [a, b] = h.split('/');
  let html, title = 'Bazar Marrakech — Divani e salotti in velluto e oro';
  if (a === 'negozio') { html = negozio(b); title = 'Negozio — Bazar Marrakech'; }
  else if (a === 'p') { html = prodotto(b); const p = byId(b); if (p) title = `${p.nome} — Bazar Marrakech`; }
  else if (a === 'borsa') { html = borsaPagina(); title = 'Borsa — Bazar Marrakech'; }
  else html = home();
  app.innerHTML = `<div class="page">${html}</div>`;
  document.title = title;
  $$('.nav-links a').forEach((l) => l.toggleAttribute('aria-current', l.getAttribute('href') === '#/' + h));
  chiudiMenu();
  if (a === 'showroom') requestAnimationFrame(() => $('#showroom')?.scrollIntoView());
  else window.scrollTo(0, 0);
  attiva();
}

function attiva() {
  // comparsa allo scroll
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
  $$('.rv').forEach((el) => io.observe(el));
  pulizia.push(() => io.disconnect());

  // scaffali orizzontali
  $$('[data-shelf]').forEach((b) => b.addEventListener('click', () => {
    const s = b.closest('section').querySelector('.shelf');
    s.scrollBy({ left: +b.dataset.shelf * s.clientWidth * 0.8, behavior: 'smooth' });
  }));

  // scroll-driven: hero, dettaglio, primo piano
  const hero = $('#heroImg'), scr = $('#scrolly'), close = $('#closeImg');
  const caps = scr ? $$('.cap', scr) : [], bars = scr ? $$('.scrolly-bar b', scr) : [];
  let raf = 0;
  const frame = () => {
    raf = 0;
    const vh = innerHeight;
    if (hero) { const t = Math.min(1, scrollY / vh); hero.style.setProperty('--s', (1.06 - t * 0.06).toFixed(4)); }
    if (scr) {
      const r = scr.getBoundingClientRect();
      const t = Math.min(1, Math.max(0, -r.top / (r.height - vh)));
      $('#scrollyImg').style.setProperty('--z', (1.55 - t * 0.55).toFixed(4));
      $('#scrollyImg').style.setProperty('--b', (0.42 + t * 0.2).toFixed(3));
      const k = Math.min(caps.length - 1, Math.floor(t * caps.length));
      caps.forEach((c, i) => c.classList.toggle('on', i === k));
      bars.forEach((b, i) => b.style.setProperty('--p', Math.min(1, Math.max(0, t * caps.length - i)).toFixed(3)));
    }
    if (close) { const r = close.getBoundingClientRect(); const t = 1 - Math.min(1, Math.max(0, (r.top + r.height) / (vh + r.height))); close.style.setProperty('--z', (1.15 - t * 0.15).toFixed(4)); }
  };
  const onScroll = () => { if (!raf) raf = requestAnimationFrame(frame); };
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    addEventListener('scroll', onScroll, { passive: true }); frame();
    pulizia.push(() => removeEventListener('scroll', onScroll));
  }

  // galleria prodotto
  const tr = $('#gTrack');
  if (tr) {
    const vai = (i) => tr.scrollTo({ left: i * tr.clientWidth });
    const idx = () => Math.round(tr.scrollLeft / tr.clientWidth);
    $$('[data-thumb]').forEach((b) => b.addEventListener('click', () => vai(+b.dataset.thumb)));
    $$('[data-g]').forEach((b) => b.addEventListener('click', () => { const n = tr.children.length; vai((idx() + +b.dataset.g + n) % n); }));
    tr.addEventListener('scroll', () => { const i = idx(); $$('[data-thumb]').forEach((b, j) => b.setAttribute('aria-current', i === j)); }, { passive: true });
  }
  const q = $('#qty');
  if (q) {
    $$('[data-qty]').forEach((b) => b.addEventListener('click', () => { q.value = q.textContent = Math.max(1, Math.min(9, +q.textContent + +b.dataset.qty)); }));
    const id = location.hash.split('/')[2];
    $('#addBtn').addEventListener('click', () => aggiungi(id, +q.textContent));
    $('#favBtn').addEventListener('click', (e) => {
      preferiti.has(id) ? preferiti.delete(id) : preferiti.add(id);
      store.set('preferiti', [...preferiti]);
      e.currentTarget.setAttribute('aria-pressed', preferiti.has(id));
    });
    $$('[data-scroll]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); $('#buy').scrollIntoView({ behavior: 'smooth', block: 'start' }); }));
  }

  // borsa
  $$('[data-bq]').forEach((b) => b.addEventListener('click', () => {
    const r = borsa.find((x) => x.id === b.dataset.bq);
    r.q = Math.max(1, Math.min(9, r.q + +b.dataset.d)); salvaBorsa(); render();
  }));
  $$('[data-rm]').forEach((b) => b.addEventListener('click', () => { borsa = borsa.filter((x) => x.id !== b.dataset.rm); salvaBorsa(); render(); }));
  const f = $('#checkout');
  if (f) f.addEventListener('submit', (e) => {
    e.preventDefault();
    let ok = true;
    $$('[required]', f).forEach((el) => {
      const bad = el.type === 'checkbox' ? !el.checked : !el.value.trim();
      el.closest('.field')?.classList.toggle('err', bad);
      if (bad) ok = false;
    });
    if (!ok) { $('.err input, [required]:not(:checked)', f)?.focus(); return; }
    inviaOrdine(Object.fromEntries(new FormData(f)));
  });
}

/* --- menu mobile --------------------------------------------------------- */
const menu = $('#sheetMenu');
function chiudiMenu() { menu.classList.remove('open'); menu.setAttribute('aria-hidden', 'true'); $('#menuBtn').setAttribute('aria-expanded', 'false'); document.body.style.overflow = ''; }
$('#menuBtn').addEventListener('click', () => { menu.classList.add('open'); menu.setAttribute('aria-hidden', 'false'); $('#menuBtn').setAttribute('aria-expanded', 'true'); document.body.style.overflow = 'hidden'; });
$('#menuClose').addEventListener('click', chiudiMenu);

/* --- footer -------------------------------------------------------------- */
$('#yr').textContent = new Date().getFullYear();
$('[data-maps]').href = NEGOZIO.mappa; $('[data-maps]').target = '_blank';
$('[data-ig]').href = 'https://instagram.com/' + NEGOZIO.instagram; $('[data-ig]').target = '_blank';
$('[data-phones]').innerHTML = NEGOZIO.telefoni.map((t) => `<a href="${tel(t.n)}">${t.nome} · ${t.n}</a>`).join('') + `<a href="mailto:${NEGOZIO.email}">${NEGOZIO.email}</a>`;

addEventListener('hashchange', render);
aggiornaBadge();
render();
</script>
